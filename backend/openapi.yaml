openapi: 3.1.0
info:
  title: Status (Monitoring & Crash Reporting) API
  version: 0.4.0
  description: >-
    API for the status service. Actively monitors registered sites, ingests
    crash reports from them, and (v3) collects bug reports written by the users
    of those sites. Companion to PRD.md.

    0.3.0 is the first version of this document reconciled against the built
    service. Corrections over 0.2.0, all of which describe behaviour that has
    been live since 2026-08-02: the three `/api/auth/*` routes and `GET
    /api/meta` were never documented; the SPA authenticates with a **session
    cookie plus a double-submit CSRF token**, not the `bearerAuth` JWT this
    document used to claim; and `buckets` defaults per window rather than to a
    fixed 90.

    0.4.0 adds email notifications: the `/api/notifications/*` settings routes
    and `notifications_enabled` on `GET /api/meta`. The notifications
    themselves are not an API — a worker emails the configured recipients —
    so what this document describes is how they are configured and what became
    of them.

    Auth: dashboard endpoints require the `session` cookie, and every unsafe
    method additionally requires `X-CSRF-Token` matching the `csrf` cookie and
    an `Origin`/`Referer` within `STATUS_ALLOWED_ORIGINS`. Crash ingest is
    public and authenticated per-site by `X-Ingest-Key`. The v3 feedback widget
    endpoints are public and authenticated per-site by `X-Widget-Key`. Health
    probes are unauthenticated.
servers:
  - url: https://status.tilcer.cz
    description: Production (Coolify)

tags:
  - name: health
    description: Liveness/readiness probes (baseline for every backend)
  - name: sites
    description: Registry of monitored sites (admin)
  - name: monitoring
    description: Check history (admin)
  - name: crashes
    description: Crash groups and events (admin)
  - name: ingest
    description: Public crash ingest (per-site ingest key)
  - name: auth
    description: Mode B session login/logout against the shared auth backend
  - name: feedback
    description: User bug reports — the cross-site inbox (admin)
  - name: widget
    description: Public feedback-widget endpoints (per-site widget key)
  - name: notifications
    description: >-
      Email notification settings and delivery history. Reads need a session;
      changes and the test send need `admin`.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (includes SQLite check)
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready (e.g. DB unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Sites (admin) ---
  # --- Auth (Mode B; public, pre-session) ---
  # Present since the initial 2026-08-02 build; absent from this document until 0.3.0.
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in and open a session
      description: >-
        Verifies the credentials against the shared auth backend (site `status`)
        and sets the `session` and `csrf` cookies. Runs outside the session gate —
        login must work before a session exists. The auth service's MFA challenge
        surfaces as `409 mfa_required`; status does not handle MFA in-app and the
        login screen links out to auth.tilcer.cz.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Session established; `session` and `csrf` cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: MFA challenge required; complete it at auth.tilcer.cz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/session:
    get:
      tags: [auth]
      summary: Describe the current session
      description: Returns the authenticated actor and roles, or 401 when there is no session.
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: End the session
      description: Clears the session server-side and expires both cookies. CSRF-protected.
      responses:
        "204":
          description: Session ended
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"

  # --- Service metadata ---
  /api/meta:
    get:
      tags: [monitoring]
      summary: Service metadata the SPA needs to label its UI
      description: >-
        Returns the configured uptime window so the board labels the figure with
        the real `STATUS_UPTIME_WINDOW` instead of hardcoding 90 days.

        Present since the initial build and undocumented until 0.3.0 — and it
        **404s in production** because `httpx.StripAPIPrefix`'s re-prefix
        allow-list omits `/meta`. See PRD §V2-12.11 and §V3-8.
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                required: [uptime_window_days]
                properties:
                  uptime_window_days:
                    type: integer
                    examples: [90]
                  feedback_enabled:
                    type: boolean
                    description: v3 — whether the feedback module is configured on this deployment
                  notifications_enabled:
                    type: boolean
                    description: >-
                      0.4.0 — whether this deployment has a mail provider
                      (`STATUS_RESEND_API_KEY`, or the log-only mailer of a
                      development deployment). When false the notifications
                      page can only say so; turning them on answers 503.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/sites:
    get:
      tags: [sites]
      summary: List sites with current status
      parameters:
        - name: status
          in: query
          description: Filter by computed color
          schema:
            $ref: "#/components/schemas/Color"
      responses:
        "200":
          description: Sites with computed color and headline counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sites]
      summary: Register a monitored site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "201":
          description: Site created; ingest key returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteWithKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A site with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/sites/{id}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [sites]
      summary: Get a site
      responses:
        "200":
          description: Site detail with computed color and counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [sites]
      summary: Update a site (id is immutable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdate"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [sites]
      summary: Delete a site (cascades checks, groups, events)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sites/{id}/rotate-key:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [sites]
      summary: Rotate the ingest key (old key stops working immediately)
      responses:
        "200":
          description: New ingest key (shown once)
          content:
            application/json:
              schema:
                type: object
                required: [ingest_key]
                properties:
                  ingest_key:
                    type: string
                    examples: ["ik_9f2c...redacted"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sites/{id}/checks:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    get:
      tags: [monitoring]
      summary: Recent check history for a site
      responses:
        "200":
          description: Paginated check results (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckResult"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sites/{id}/uptime:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: window
        in: query
        description: Aggregation window
        schema:
          type: string
          enum: [24h, 7d, 30d, 90d]
          default: 90d
      - name: buckets
        in: query
        description: >-
          Number of time buckets for the strip/sparkline. The default is
          **per window** — 24 for `24h`, 7 for `7d`, 30 for `30d`, 90 for `90d` —
          not a fixed 90 as 0.2.0 claimed. Non-24h grids are snapped to whole UTC
          days so day rollups do not straddle bucket boundaries.
        schema:
          type: integer
          minimum: 1
          maximum: 180
    get:
      tags: [monitoring]
      summary: Aggregated uptime & latency for a site
      description: >-
        Served from maintained daily check rollups (not a raw-row scan), so it stays
        cheap and survives raw-check retention. Returns overall uptime %, latency
        percentiles, and per-bucket data to render the uptime strip.
      responses:
        "200":
          description: Aggregated uptime + latency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sites/{id}/crashes:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: status
        in: query
        schema:
          $ref: "#/components/schemas/GroupStatus"
      - name: level
        in: query
        schema:
          $ref: "#/components/schemas/Level"
      - $ref: "#/components/parameters/Limit"
      - $ref: "#/components/parameters/Cursor"
    get:
      tags: [crashes]
      summary: List crash groups for a site
      responses:
        "200":
          description: Paginated crash groups (by last_seen desc)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrashGroup"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/crashes/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [crashes]
      summary: Get a crash group with recent events
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Group plus paginated events
          content:
            application/json:
              schema:
                type: object
                required: [group, events]
                properties:
                  group:
                    $ref: "#/components/schemas/CrashGroup"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/CrashEvent"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [crashes]
      summary: Triage a crash group (open/resolved/ignored)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/GroupStatus"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrashGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # --- Ingest (public, per-site key) ---
  /api/ingest/{siteId}:
    parameters:
      - name: siteId
        in: path
        required: true
        description: The user-supplied site id this crash belongs to
        schema:
          $ref: "#/components/schemas/SiteIdString"
    post:
      tags: [ingest]
      summary: Ingest a crash report
      description: >-
        Public endpoint. Authenticated by the per-site ingest key in the
        `X-Ingest-Key` header. Rate-limited per key and size-capped
        (default 64 KB). Called by backends (Go) and frontends (browser JS).
      security:
        - ingestKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrashReport"
      responses:
        "202":
          description: Accepted; grouped by fingerprint
          content:
            application/json:
              schema:
                type: object
                required: [group_id, event_id]
                properties:
                  group_id:
                    type: integer
                  event_id:
                    type: integer
        "401":
          description: Missing or invalid ingest key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==========================================================================
  # v3 — Feedback
  # Admin inbox (session + CSRF) and the three public widget routes.
  # ==========================================================================

  /api/reports:
    get:
      tags: [feedback]
      summary: The cross-site report inbox
      description: >-
        One queue across every site, newest first, keyset-paginated. This is the
        working surface: filter by state to triage, by site to review one app.
      parameters:
        - name: state
          in: query
          description: Filter by triage state
          schema:
            $ref: "#/components/schemas/ReportState"
        - name: site
          in: query
          description: Filter to one site
          schema:
            $ref: "#/components/schemas/SiteIdString"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ReportKind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportSummary"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/reports/{ref}:
    parameters:
      - $ref: "#/components/parameters/ReportRef"
    get:
      tags: [feedback]
      summary: One report, with its context and attachments
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [feedback]
      summary: Triage a report
      description: Sets the state and/or the internal note. Requires the `admin` role.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPatch"
      responses:
        "200":
          description: The updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [feedback]
      summary: Delete a report and its stored files
      description: >-
        Deletes the row and then the R2 objects, in that order — the object keys
        are read inside the transaction and the deletes are issued after it
        commits (PRD §V3-4, FR-22). An object whose delete fails is left for the
        nightly sweep; the response does not wait on R2. Requires `admin`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/reports/{ref}/attachments/{attachmentId}/url:
    parameters:
      - $ref: "#/components/parameters/ReportRef"
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [feedback]
      summary: Mint a short-lived view URL for one attachment
      description: >-
        Returns a presigned GET valid for `STATUS_FEEDBACK_VIEW_TTL` (default
        5 minutes). The bucket is private and has no public base URL, so this is
        the only way to see an attachment. ⚠ The URL is a bearer token for its
        lifetime — anyone it is forwarded to can open it until it expires, which
        is why the response is sent `Cache-Control: no-store`, as the widget's
        credential-bearing responses are. It is the only response on the
        session-gated side that carries one.

        R2 serves range requests against it, which is why video seeks correctly
        without the service implementing ranges itself.
      responses:
        "200":
          description: A presigned URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, content_type]
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
                  content_type:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Unknown report, unknown attachment, or the attachment is not in
            `stored` state — a `pending` or `missing` object has no URL to mint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sites/{id}/feedback-config:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [feedback]
      summary: Read a site's feedback configuration
      description: >-
        A site with no configuration row has feedback **off**; this returns the
        absent-means-off shape rather than 404, so the dashboard can render the
        switch without a special case.
      responses:
        "200":
          description: The site's feedback configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [feedback]
      summary: Enable, disable or reconfigure a site's widget
      description: >-
        `enabled: false` is the kill switch — the widget stops rendering on the
        next page load and a submission from a stale page gets 403, without any
        key being rotated. Requires `admin`.

        ⚠ Only a request that sets `enabled: true` may CREATE a site's
        configuration. Creating it mints the widget key and returns the
        plaintext exactly once, so a request that changes some other setting on
        a site that has never had feedback enabled is a 422 rather than a silent
        key issue nobody would see again.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackConfigPatch"
      responses:
        "200":
          description: The updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            The body set no field, or it would have created the site's
            configuration without enabling feedback — see the note above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            The deployment has no object storage configured
            (`STATUS_FEEDBACK_ENABLED` is false), so feedback cannot be turned on
            for any site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sites/{id}/rotate-widget-key:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [feedback]
      summary: Rotate the site's widget key
      description: >-
        Issues a new `wk_` key and returns the plaintext **once**. The old key
        stops working immediately. Independent of `rotate-key`: rotating the
        widget key never disturbs crash ingest, which is the whole reason the two
        keys are separate. Requires `admin`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The new widget key, shown once
          content:
            application/json:
              schema:
                type: object
                required: [widget_key]
                properties:
                  widget_key:
                    type: string
                    examples: ["wk_8Nq2…"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Widget (public, per-site widget key) ---------------------------------
  # These three sit under /api/ingest/ deliberately: that prefix is already on
  # httpx.StripAPIPrefix's re-prefix allow-list and demonstrably works in
  # production, where /api/meta does not. See PRD §V3-6.
  #
  # They are the only routes on this service that answer a cross-origin request.
  # CORS is applied to the public group only and echoes an origin matching
  # STATUS_ALLOWED_ORIGINS (default `https://*.tilcer.cz`); it never sends
  # Access-Control-Allow-Credentials.

  /api/ingest/{siteId}/feedback/config:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SiteIdString"
    get:
      tags: [widget]
      summary: What the widget needs before it renders anything
      description: >-
        The widget calls this first and renders **no launcher at all** unless it
        answers `enabled: true` — a disabled site must never show a button that
        fails when pressed.

        The response carries a single-use `ticket`. Submission requires it, which
        is what makes the minimum-dwell check meaningful: a `dwell_ms` field sent
        by the client is a number the client chooses, whereas the ticket's issue
        time is signed by the server.

        ⚠ All three widget responses are sent `Cache-Control: no-store`. Two of
        them carry single-use credentials — this one a ticket, the submission a
        set of presigned upload URLs — and an intermediary that served one
        reporter's ticket to another would dead-end the second dialog with a 422
        nobody could act on.
      security:
        - widgetKey: []
      responses:
        "200":
          description: Widget configuration and a submission ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetConfig"
        "401":
          description: Missing or invalid widget key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Feedback is disabled for this site, or the origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/ingest/{siteId}/feedback:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SiteIdString"
    post:
      tags: [widget]
      summary: Submit a bug report
      description: >-
        Accepts the report text and the *declared* attachments, and returns a
        presigned PUT for each. Upload URLs exist **only** in this response —
        there is no standalone "give me an upload URL" endpoint, so no accepted
        report means no way to write a byte into the bucket.

        Each presigned PUT signs `Content-Type` and `Content-Length` at the exact
        declared size (clamped server-side to the cap first). That signature is
        the only size enforcement a presigned PUT can have: a URL signed for N
        bytes refuses N+1, and it refuses it at R2, before anything reaches the
        droplet.

        Guard order, asserted by test: 404 unknown site → 401 bad key → 403
        disabled → 403 origin → 429 over rate → 413 oversized → 422 invalid →
        202. The body is never parsed before the key is checked.
      security:
        - widgetKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "202":
          description: Report stored; upload slots issued for the declared files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackAccepted"
        "401":
          description: Missing or invalid widget key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Feedback disabled for this site, or the origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: >-
            The JSON body exceeds `STATUS_FEEDBACK_MAX_TEXT_BYTES`. An oversized
            *file* is never refused here — it is refused by R2 against the signed
            content-length.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Bad or spent ticket, honeypot filled, dwell below the minimum,
            unknown content type, too many files, or empty message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/ingest/{siteId}/feedback/{ref}/claim:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SiteIdString"
      - $ref: "#/components/parameters/ReportRef"
    post:
      tags: [widget]
      summary: Confirm which uploads actually landed
      description: >-
        HEADs every pending object and records **the size R2 reports**, not the
        size the client declared. An object that is absent or the wrong size is
        marked `missing`; the report itself always survives, because the text is
        the thing worth keeping.

        Idempotent, and it can only ever touch attachments belonging to the `ref`
        it names. A report whose claim never arrives keeps its `pending` rows
        until the nightly sweep marks them `missing` and deletes the objects.
      security:
        - widgetKey: []
      responses:
        "200":
          description: The resulting attachment states
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttachmentSummary"
        "401":
          description: Missing or invalid widget key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Feedback disabled for this site, or the origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # --- Notifications (admin) --------------------------------------------------
  # Email about new crash groups, crashes that came back, new feedback reports,
  # and sites going down and coming back up. Queued inside the transaction that
  # caused it, folded into one digest per STATUS_NOTIFY_DIGEST_WINDOW, and sent
  # by a background worker that retries with the digest's idempotency key.
  /api/notifications/settings:
    get:
      tags: [notifications]
      summary: Read the notification settings
      description: >-
        Readable by any session. `recipients` is **null** for a caller without
        `admin` — the addresses are personal data and nothing a non-admin can
        do on the page needs them.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [notifications]
      summary: Replace the notification settings
      description: >-
        Every field is required; mutes have their own routes. Recipients are
        plain addresses (no display name), at most 5, deduplicated ignoring
        case; blank entries are dropped. Requires `admin`.

        Settings apply to what is queued from now on — and a digest is
        re-checked against them when it is assembled, so muting a site or
        switching a kind off also drops what was already waiting. Switching the
        master switch off cancels every digest not yet sent and drops every
        notification not yet in one, in the same transaction: the deliveries
        list read after this response shows them `failed`, and switching back
        on starts from an empty queue. Changing the recipients supersedes a
        digest still pending — it turns `failed` and what it carried goes out
        again, to the new recipients, in the next digest.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "422":
          description: >-
            A field is missing, a recipient is not a plain address, there are
            more than 5, or `enabled` is true with no recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            `enabled` is true but this deployment has no mail provider
            (`mail_unconfigured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/notifications/muted-sites/{siteId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SiteIdString"
    put:
      tags: [notifications]
      summary: Mute a site
      description: >-
        Nothing about the site is emailed until it is unmuted, and anything
        already queued for it is dropped when the next digest is assembled; a
        digest already assembled and waiting on a retry is sent as written. The
        board is unaffected. Idempotent. Requires `admin`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Muted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [notifications]
      summary: Unmute a site
      description: Idempotent. Requires `admin`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Unmuted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notifications/test:
    post:
      tags: [notifications]
      summary: Send a test email to the saved recipients
      description: >-
        Sends one email immediately, straight through the provider — not
        queued, not digested, and regardless of the master switch and the
        per-kind toggles: its job is to prove the provider and the addresses
        work before anything real depends on them. Uses the SAVED recipients,
        so save first. Requires `admin`.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The provider accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CSRFOrOriginRejected"
        "422":
          description: No recipient is saved (`no_recipients`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: >-
            The provider refused the message or could not be reached
            (`mail_failed`); `detail` carries the provider's reason — an
            unverified sender domain, a bad key, an invalid address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: This deployment has no mail provider (`mail_unconfigured`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/notifications/deliveries:
    get:
      tags: [notifications]
      summary: Recent notification emails and what became of them
      description: >-
        Newest first. A digest is `pending` until the provider accepts it
        (`sent`) or the worker gives up (`failed`: refused permanently, not
        delivered within 23 hours, cancelled by switching notifications off, or
        superseded because the sender or the recipients changed — its
        notifications then go out again in the next digest). While one is
        `pending`, no new digest is assembled: what arrives meanwhile waits and
        goes out together once it is settled.
        `recipients` is null for a non-admin, as on the settings, and every
        address in a non-admin's `last_error` reads `[address]`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >-
        The dashboard session (Mode B). This — not a bearer JWT — is how every
        gated endpoint is authenticated. 0.2.0 documented `bearerAuth`; the SPA
        has never sent one, and the scheme has been removed rather than left
        standing as a contract nobody implements.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Double-submit CSRF token, equal to the JS-readable `csrf` cookie.
        **Required on every unsafe method** of a cookie-authenticated endpoint,
        in addition to `sessionCookie`. The same middleware also rejects a
        request whose `Origin`/`Referer` is outside `STATUS_ALLOWED_ORIGINS`
        (403). Safe methods pass through.
    ingestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
      description: Per-site crash-ingest key (public, Sentry-DSN style). Scoped to POST /api/ingest/{siteId}.
    widgetKey:
      type: apiKey
      in: header
      name: X-Widget-Key
      description: >-
        v3. Per-site feedback-widget key (`wk_` + 32 url-safe bytes, SHA-256
        stored, shown once, independently rotatable). Public by design, like the
        ingest key. Scoped to the three `/api/ingest/{siteId}/feedback*` routes
        and to nothing else — it can neither post a crash nor read anything.
    serviceSecret:
      type: apiKey
      in: header
      name: X-Service-Secret
      description: >-
        BE→BE shared secret. Not accepted on any inbound route of this service —
        status *sends* it to the auth backend (`STATUS_AUTH_SERVICE_SECRET`).
        Retained here only to document that it is outbound, correcting 0.2.0's
        "unused in v1; reserved".

  parameters:
    SiteId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SiteIdString"
    Limit:
      name: limit
      in: query
      description: Max items per page
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor
      schema:
        type: string
    ReportRef:
      name: ref
      in: path
      required: true
      description: The reference code shown to the reporter
      schema:
        $ref: "#/components/schemas/ReportRefString"

  responses:
    CSRFOrOriginRejected:
      description: >-
        CSRF token missing/mismatched, or the request `Origin`/`Referer` is
        outside `STATUS_ALLOWED_ORIGINS`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded; retry after the interval in `Retry-After`.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

    Color:
      type: string
      enum: [red, orange, green, unknown]
    Level:
      type: string
      enum: [fatal, error, warning]
    GroupStatus:
      type: string
      enum: [open, resolved, ignored]
    SiteIdString:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      examples: ["home", "fin", "yarnlog"]

    SiteCreate:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/SiteIdString"
        name:
          type: string
        monitor_url:
          type: [string, "null"]
          format: uri
          description: Endpoint to poll; null/omitted = crash-only site
        monitor_enabled:
          type: boolean
          default: true
        expected_status:
          type: integer
          default: 200
        crash_window_hours:
          type: integer
          default: 24
          minimum: 1

    SiteUpdate:
      type: object
      description: id is immutable and cannot be changed
      properties:
        name:
          type: string
        monitor_url:
          type: [string, "null"]
          format: uri
        monitor_enabled:
          type: boolean
        expected_status:
          type: integer
        crash_window_hours:
          type: integer
          minimum: 1

    SiteSummary:
      type: object
      required: [id, name, color, monitor_enabled]
      properties:
        id:
          $ref: "#/components/schemas/SiteIdString"
        name:
          type: string
        color:
          $ref: "#/components/schemas/Color"
        monitor_url:
          type: [string, "null"]
        monitor_enabled:
          type: boolean
        expected_status:
          type: integer
        crash_window_hours:
          type: integer
        last_checked_at:
          type: [string, "null"]
          format: date-time
        last_ok:
          type: [boolean, "null"]
        fail_streak:
          type: integer
          description: Consecutive failed checks; site goes red at RED_FAIL_THRESHOLD (default 2)
        uptime_pct:
          type: [number, "null"]
          description: >-
            Rolling uptime % over UPTIME_WINDOW (default 90d), from check rollups.
            null when monitoring is disabled or no checks exist yet — the UI renders
            a "monitoring off" affordance rather than a health percentage in that case.
        open_crash_groups:
          type: integer
        recent_crash_count:
          type: integer
          description: Crash events within crash_window_hours
        open_reports:
          type: [integer, "null"]
          description: >-
            v3. Count of user reports in state `new` for this site — the unread
            badge on the board card. **Deliberately not part of `color`**: a
            person saying "this is confusing" must not make a site look degraded
            beside a real outage.

            Null, not zero, when the feedback module is not composed into this
            deployment; the card then renders no badge at all.
        created_at:
          type: string
          format: date-time

    SiteWithKey:
      allOf:
        - $ref: "#/components/schemas/SiteSummary"
        - type: object
          required: [ingest_key]
          properties:
            ingest_key:
              type: string
              description: Plaintext ingest key — shown once, only stored hashed
              examples: ["ik_9f2c...redacted"]

    UptimeSummary:
      type: object
      required: [window, from, to, uptime_pct, checks_total, checks_failed, buckets]
      properties:
        window:
          type: string
          enum: [24h, 7d, 30d, 90d]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        uptime_pct:
          type: [number, "null"]
          description: null when monitoring disabled or no checks in window
        checks_total:
          type: integer
        checks_failed:
          type: integer
        latency_p50_ms:
          type: [integer, "null"]
        latency_p95_ms:
          type: [integer, "null"]
        buckets:
          type: array
          description: One entry per time bucket, oldest first, for the uptime strip
          items:
            $ref: "#/components/schemas/UptimeBucket"

    UptimeBucket:
      type: object
      required: [start, end, ok_pct, checks, failed]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        ok_pct:
          type: [number, "null"]
          description: null when the bucket had no checks (gap)
        checks:
          type: integer
        failed:
          type: integer
        latency_p50_ms:
          type: [integer, "null"]

    CheckResult:
      type: object
      required: [id, site_id, checked_at, ok]
      properties:
        id:
          type: integer
        site_id:
          $ref: "#/components/schemas/SiteIdString"
        checked_at:
          type: string
          format: date-time
        ok:
          type: boolean
        status_code:
          type: [integer, "null"]
        latency_ms:
          type: [integer, "null"]
        error:
          type: [string, "null"]

    CrashReport:
      type: object
      required: [message]
      properties:
        message:
          type: string
        level:
          $ref: "#/components/schemas/Level"
        stack:
          type: string
        environment:
          type: string
          examples: ["prod", "dev"]
        release:
          type: string
        fingerprint:
          type: string
          description: Client-supplied grouping override
        context:
          type: object
          additionalProperties: true
          description: Free-form tags/metadata; size-capped
        occurred_at:
          type: string
          format: date-time
          description: Client event time; server uses receipt time if absent

    CrashGroup:
      type: object
      required: [id, site_id, fingerprint, title, level, count, status, first_seen, last_seen]
      properties:
        id:
          type: integer
        site_id:
          $ref: "#/components/schemas/SiteIdString"
        fingerprint:
          type: string
        title:
          type: string
        level:
          $ref: "#/components/schemas/Level"
        count:
          type: integer
        status:
          $ref: "#/components/schemas/GroupStatus"
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    CrashEvent:
      type: object
      required: [id, group_id, site_id, level, message, occurred_at, received_at]
      properties:
        id:
          type: integer
        group_id:
          type: integer
        site_id:
          $ref: "#/components/schemas/SiteIdString"
        level:
          $ref: "#/components/schemas/Level"
        message:
          type: string
        stack:
          type: [string, "null"]
        environment:
          type: [string, "null"]
        release:
          type: [string, "null"]
        context:
          type: [object, "null"]
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time

    # --- Session (v2 behaviour, documented from 0.3.0) ---
    Session:
      type: object
      required: [actor_id, roles]
      properties:
        actor_id:
          type: string
        email:
          type: [string, "null"]
        roles:
          type: array
          items:
            type: string
          description: >-
            Fleet roles from the auth backend. Any authenticated session may
            read; mutations require `admin` (or `*`) via httpx.RequireAdmin.
        expires_at:
          type: [string, "null"]
          format: date-time

    # --- v3 — Feedback ---
    ReportKind:
      type: string
      enum: [bug, idea, other]
      description: >-
        What the reporter said this is. A hint, not a verdict — triage may change
        it. Rendered in the widget as Chyba / Nápad / Něco jiného.
    ReportState:
      type: string
      enum: [new, open, resolved, declined]
    AttachmentState:
      type: string
      enum: [pending, stored, missing]
      description: >-
        `pending` — a slot was issued and the object has not been confirmed.
        `stored` — HEAD confirmed it at the expected size.
        `missing` — it was never uploaded, was the wrong size, or has been swept.
    ReportRefString:
      type: string
      pattern: "^R-[0-9A-HJKMNP-TV-Z]{4}$"
      description: >-
        The reference shown to the reporter, e.g. `R-7QK2`. Crockford base32
        (no I, L, O or U), so it survives being read aloud or written down.
        A convenience code, not a secret — every route that takes it is either
        admin-gated or requires the site's widget key.
      examples: ["R-7QK2"]

    AttachmentSummary:
      type: object
      required: [id, state, content_type]
      properties:
        id:
          type: integer
        state:
          $ref: "#/components/schemas/AttachmentState"
        content_type:
          type: string
        byte_size:
          type: [integer, "null"]
          description: Confirmed by HEAD at claim; null while pending.
        created_at:
          type: string
          format: date-time

    ReportSummary:
      type: object
      required: [ref, site_id, kind, state, message, created_at]
      properties:
        ref:
          $ref: "#/components/schemas/ReportRefString"
        site_id:
          $ref: "#/components/schemas/SiteIdString"
        kind:
          $ref: "#/components/schemas/ReportKind"
        state:
          $ref: "#/components/schemas/ReportState"
        message:
          type: string
          description: Truncated in the list; the detail carries the whole text.
        reporter_label:
          type: [string, "null"]
          description: >-
            An untrusted display string supplied by the host app. Never an
            identity, never joined to anything — escaped and shown.
        attachment_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Report:
      allOf:
        - $ref: "#/components/schemas/ReportSummary"
        - type: object
          properties:
            page_url:
              type: [string, "null"]
              description: >-
                ⚠ Can carry query-string secrets from a badly built host app.
                Stored as sent; the dashboard does not make it clickable without
                an explicit action.
            referrer:
              type: [string, "null"]
            user_agent:
              type: [string, "null"]
            viewport:
              type: [string, "null"]
            locale:
              type: [string, "null"]
            app_release:
              type: [string, "null"]
            console_tail:
              type: [array, "null"]
              items:
                type: string
              description: >-
                Present only when the site opted in (`console_capture`). Capped
                at 50 lines × 200 chars, and the widget shows the reporter what
                will be sent before they submit.
            last_error:
              type: [string, "null"]
            internal_note:
              type: [string, "null"]
              description: >-
                Admin-only; never leaves the dashboard and never reaches the
                reporter. This route is session-gated rather than admin-gated —
                any session may read a report — so the field itself is the gate:
                it is `null` for a caller without the `admin` role, whether or
                not a note exists.
            resolved_at:
              type: [string, "null"]
              format: date-time
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentSummary"

    ReportPatch:
      type: object
      minProperties: 1
      properties:
        state:
          $ref: "#/components/schemas/ReportState"
        internal_note:
          type: [string, "null"]
        kind:
          $ref: "#/components/schemas/ReportKind"

    FeedbackConfig:
      type: object
      required: [site_id, enabled, console_capture]
      properties:
        site_id:
          $ref: "#/components/schemas/SiteIdString"
        enabled:
          type: boolean
          description: The kill switch. Absent configuration means false.
        console_capture:
          type: boolean
          description: >-
            Opt-in. Off by default because a console tail from `home` could carry
            a private note's title into status — see PRD §V3-8.
        widget_key_set_at:
          type: [string, "null"]
          format: date-time
          description: When the current key was issued. The key itself is never returned.
        updated_at:
          type: [string, "null"]
          format: date-time

    FeedbackConfigPatch:
      type: object
      minProperties: 1
      properties:
        enabled:
          type: boolean
        console_capture:
          type: boolean

    WidgetConfig:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        ticket:
          type: [string, "null"]
          description: >-
            Single-use, signed, site-scoped. Required by the submit call, which
            rejects it if it is younger than the minimum dwell, older than 30
            minutes, already spent, or signed for a different site.
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/ReportKind"
        max_files:
          type: integer
        max_image_bytes:
          type: integer
        max_video_bytes:
          type: integer
        max_text_bytes:
          type: integer
          description: >-
            The cap on the whole submission body, which the widget has to
            enforce: it is smaller than the sum of the field limits this
            contract allows, so a client trims what it generates (the console
            tail) to what the rest of the payload leaves. Exceeding it is a 413.
        min_dwell_ms:
          type: integer
          description: >-
            How old a ticket must be before a submission carrying it is accepted
            (STATUS_FEEDBACK_MIN_DWELL_MS, 3000 by default, always under 30000).
            A client that mints a replacement ticket — after a failed send, say —
            must wait out this interval before posting it, or the retry is
            refused as a script with a 422 every time.
        accept:
          type: array
          items:
            type: string
          description: >-
            The fixed allow-list of content types. Matched against what the
            client declares — never inferred from the filename — and signed into
            the upload URL.
          examples:
            - ["image/png", "image/jpeg", "image/webp", "image/gif", "video/mp4", "video/webm"]
        console_capture:
          type: boolean
          description: Tells the widget whether to collect a console tail at all.
        strings_version:
          type: integer
          description: >-
            Bumped when the bundled CZ/EN strings change. The widget ships its own
            strings; this exists only so a mismatch is diagnosable.

    DeclaredFile:
      type: object
      required: [content_type, byte_size]
      properties:
        content_type:
          type: string
        byte_size:
          type: integer
          description: >-
            The declared size, clamped to the cap before the URL is signed. A
            client that under-declares gets a URL that refuses the file it has.

    FeedbackSubmission:
      type: object
      required: [message, ticket]
      properties:
        message:
          type: string
          maxLength: 4000
        kind:
          $ref: "#/components/schemas/ReportKind"
        ticket:
          type: string
        reporter_label:
          type: [string, "null"]
        page_url:
          type: [string, "null"]
        referrer:
          type: [string, "null"]
        viewport:
          type: [string, "null"]
        locale:
          type: [string, "null"]
        app_release:
          type: [string, "null"]
        console_tail:
          type: [array, "null"]
          items:
            type: string
          description: Ignored unless the site has console_capture enabled.
        last_error:
          type: [string, "null"]
        website:
          type: [string, "null"]
          description: >-
            Honeypot. A hidden field no human fills in; a non-empty value is a
            422. Named plausibly on purpose.
        files:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/DeclaredFile"

    UploadSlot:
      type: object
      required: [attachment_id, url, expires_at, headers]
      properties:
        attachment_id:
          type: integer
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            The exact headers the PUT must send — `Content-Type` and
            `Content-Length` are signed, so any deviation is rejected by R2.

    FeedbackAccepted:
      type: object
      required: [ref, uploads]
      properties:
        ref:
          $ref: "#/components/schemas/ReportRefString"
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/UploadSlot"
          description: One slot per declared file, in the order declared. Empty when no files were declared.

    # --- 0.4.0 — Notifications ---
    NotificationEvents:
      type: object
      required: [crash, feedback, downtime]
      properties:
        crash:
          type: boolean
          description: >-
            New crash groups and resolved groups that came back — only for
            `error`/`fatal` events whose `environment` is `prod`, `production`
            or unset.
        feedback:
          type: boolean
          description: New feedback reports.
        downtime:
          type: boolean
          description: A site turning red, and the next successful check after it.

    NotificationSettings:
      type: object
      required: [available, provider, from, enabled, recipients, events, muted_sites, digest_window_seconds, max_per_hour, updated_at]
      properties:
        available:
          type: boolean
          description: Whether this deployment has a mail provider at all.
        provider:
          type: [string, "null"]
          description: "`resend`, or `log` on a development deployment; null when unavailable."
        from:
          type: string
          description: The sender (`STATUS_MAIL_FROM`).
        enabled:
          type: boolean
          description: The master switch. Off by default.
        recipients:
          type: [array, "null"]
          items:
            type: string
            format: email
          description: Null for a caller without `admin`.
        events:
          $ref: "#/components/schemas/NotificationEvents"
        muted_sites:
          type: array
          items:
            $ref: "#/components/schemas/SiteIdString"
        digest_window_seconds:
          type: integer
          description: "`STATUS_NOTIFY_DIGEST_WINDOW` — how long a notification waits for company."
        max_per_hour:
          type: integer
          description: "`STATUS_NOTIFY_MAX_PER_HOUR` — reaching it delays digests, never drops them."
        updated_at:
          type: [string, "null"]
          format: date-time

    NotificationSettingsUpdate:
      type: object
      required: [enabled, recipients, events]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        recipients:
          type: array
          maxItems: 5
          items:
            type: string
            format: email
            maxLength: 254
        events:
          $ref: "#/components/schemas/NotificationEvents"

    NotificationDelivery:
      type: object
      required: [id, created_at, state, subject, event_count, recipients, attempts, next_attempt_at, last_error, sent_at]
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, sent, failed]
        subject:
          type: string
        event_count:
          type: integer
          description: How many notifications the email carries.
        recipients:
          type: [array, "null"]
          items:
            type: string
          description: Frozen when the digest was rendered. Null for a caller without `admin`.
        attempts:
          type: integer
        next_attempt_at:
          type: [string, "null"]
          format: date-time
          description: Set only while pending.
        last_error:
          type: [string, "null"]
          description: >-
            The provider's refusal or the worker's reason. For a caller without
            `admin`, every address in it reads `[address]` — a provider's own
            words can name one.
        sent_at:
          type: [string, "null"]
          format: date-time

    NotificationTestResult:
      type: object
      required: [provider_message_id, recipients]
      properties:
        provider_message_id:
          type: string
        recipients:
          type: array
          items:
            type: string


# Default auth for gated endpoints. Health probes, the auth routes, crash ingest
# and the widget routes each override this with their own `security:`.
# Unsafe methods additionally require `csrfToken` — declared per operation.
security:
  - sessionCookie: []
