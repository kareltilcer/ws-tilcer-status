# Static SPA image for the `status` frontend, mirroring home/fin: Nginx serves the
# built bundle and NOTHING else. The API is NOT proxied here.
#
# In production the SPA and the Go API share one origin (status.tilcer.cz): the
# Coolify/Traefik layer routes status.tilcer.cz/api to the backend app, and
# everything else to this image. The SPA calls the API host-relative (relative
# /api — see src/api/client.ts), so there is no nginx proxy and no CORS.
#
# The offline docker-compose harness has no Traefik, so it bakes
# frontend/nginx.harness.conf instead to add a /api proxy to the `backend` service.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: serve index.html for unknown paths so deep links work.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ⚠ Say the encoding out loud. Without this nginx serves .js as
  # `text/javascript` with no charset, and the feedback widget — a classic
  # <script> loaded cross-origin by home/fin — is then decoded by the browser as
  # windows-1252 rather than UTF-8. Every Czech string in it becomes mojibake, in
  # what it shows AND in what it sends. `text/javascript` is listed explicitly
  # because nginx's own charset_types default predates that mime type.
  charset utf-8;
  charset_types text/css text/plain text/xml text/javascript application/javascript application/json;

  # The feedback widget (v3). `/widget/v1.js` gets the year-long immutable cache
  # PRD FR-24 specifies and §V3-11 checks for, and `/widget/latest.js` 302s to it
  # from an EXACT location — `=` is tested before any regex, so the block below
  # cannot stamp its own `expires 1y` on "latest" and pin it for a year.
  #
  # ⚠ The known cost, recorded rather than quietly traded away. The filename is
  # fixed and unhashed, so `immutable` means a browser that has loaded the widget
  # once will not even issue a conditional request for a year: a non-breaking fix
  # to v1 cannot reach it, inside someone else's product, with nothing on this
  # side able to do anything about it. The spec's answer is that a change ships as
  # v2.js and the three embeds are updated. If that trade is ever revisited,
  # `max-age=300` here is the whole of the change — but it is Karel's call against
  # a written acceptance criterion, not a reviewer's.
  #
  # `^~` stops nginx from testing the regex block for anything under /widget/, so
  # a future v2.js inherits this rule rather than the generic asset one.
  #
  # ⚠ Keep the .js extension. This block serves .js from the root with no
  # try_files fallback, so an unknown /widget/v99.js already 404s instead of
  # returning the SPA shell; an extensionless widget path would hit `location /`
  # and hand a host page index.html with a 200.
  location = /widget/latest.js {
    return 302 /widget/v1.js;
    add_header Cache-Control "public, max-age=300";
  }
  location ^~ /widget/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Aggressive caching for hashed assets; HTML stays fresh.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
