# Local docker-compose harness ONLY. Production does NOT use this file.
#
# In production the Coolify/Traefik layer routes status.tilcer.cz/api to the
# backend app on the same origin (see nginx.conf). Locally there is no Traefik, so
# Nginx reverse-proxies to the compose `backend` service instead — keeping the
# harness same-origin on :1155 (status's SPA uses relative /api).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:112;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The same widget contract production serves — one file, included by both, so
  # that verifying the widget in this harness verifies what actually ships.
  include /etc/nginx/widget.conf;

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
