# Local docker-compose harness ONLY. Production does NOT use this file.
#
# In production the Coolify/Traefik layer routes status.tilcer.cz/api to the
# backend app on the same origin (see nginx.conf). Locally there is no Traefik, so
# Nginx reverse-proxies to the compose `backend` service instead — keeping the
# harness same-origin on :1155 (status's SPA uses relative /api).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:112;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ⚠ Say the encoding out loud. Without this nginx serves .js as
  # `text/javascript` with no charset, and the feedback widget — a classic
  # <script> loaded cross-origin by home/fin — is then decoded by the browser as
  # windows-1252 rather than UTF-8. Every Czech string in it becomes mojibake, in
  # what it shows AND in what it sends. `text/javascript` is listed explicitly
  # because nginx's own charset_types default predates that mime type.
  charset utf-8;
  charset_types text/css text/plain text/xml text/javascript application/javascript application/json;

  # The feedback widget (v3). ⚠ The widget paths are pulled OUT of the hashed-asset
  # block below, which stamps `expires 1y; immutable` on every .js. That is right
  # for a hashed filename and wrong for these two: `/widget/v1.js` is a FIXED name
  # that host pages hardcode, and its contract being frozen does not mean its code
  # is — every non-breaking fix to v1 ships under this exact URL. `immutable`
  # suppresses even a conditional request, so a browser that loaded the widget once
  # would serve the broken copy from disk cache for a year, in someone else's
  # product, with nothing the operator could do about it. Five minutes, revalidated,
  # for a file measured in kilobytes.
  #
  # `^~` stops nginx from testing the regex block at all for anything under
  # /widget/, so v2.js inherits this rather than the year; the exact match on
  # latest.js still wins over it, because `=` is tested first.
  #
  # ⚠ Keep the .js extension. This block serves .js from the root with no
  # try_files fallback, so an unknown /widget/v99.js already 404s instead of
  # returning the SPA shell; an extensionless widget path would hit `location /`
  # and hand a host page index.html with a 200.
  location = /widget/latest.js {
    return 302 /widget/v1.js;
    add_header Cache-Control "public, max-age=300";
  }

  location ^~ /widget/ {
    add_header Cache-Control "public, max-age=300";
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
