# The feedback widget's serving contract (v3), included at server level by BOTH
# nginx.conf and nginx.harness.conf.
#
# ⚠ One copy on purpose. PRD FR-24 fixes these headers and §V3-11 checks for them
# by name, and the `immutable` trade below is one the spec's owner may yet
# revisit — a second, byte-identical copy means editing it in two places and a
# compose harness that quietly proves a policy production does not serve, in the
# one environment docs/widget.md §11 tells you to verify the widget in.

# ⚠ Say the encoding out loud. Without this nginx serves .js as `text/javascript`
# with no charset, and the widget — a classic <script> loaded cross-origin by
# home/fin — is then decoded by the browser as windows-1252 rather than UTF-8.
# Every Czech string in it becomes mojibake, in what it shows AND in what it
# sends. `text/javascript` is listed explicitly because nginx's own charset_types
# default predates that mime type.
charset utf-8;
charset_types text/css text/plain text/xml text/javascript application/javascript application/json;

# `/widget/v1.js` gets the year-long immutable cache PRD FR-24 specifies, and
# `/widget/latest.js` 302s to it from an EXACT location — `=` is tested before any
# regex, so no later block can stamp its own `expires 1y` on "latest" and pin it
# for a year.
#
# ⚠ The known cost, recorded rather than quietly traded away. The filename is
# fixed and unhashed, so `immutable` means a browser that has loaded the widget
# once will not even issue a conditional request for a year: a non-breaking fix to
# v1 cannot reach it, inside someone else's product, with nothing on this side
# able to do anything about it. The spec's answer is that a change ships as v2.js
# and the three embeds are updated. If that trade is ever revisited, `max-age=300`
# here is the whole of the change — but it is Karel's call against a written
# acceptance criterion, not a reviewer's.
#
# `^~` stops nginx from testing the generic asset regex for anything under
# /widget/, so a future v2.js inherits this rule rather than that one.
#
# ⚠ Keep the .js extension. This block serves .js from the root with no try_files
# fallback, so an unknown /widget/v99.js already 404s instead of returning the SPA
# shell; an extensionless widget path would hit `location /` and hand a host page
# index.html with a 200.
location = /widget/latest.js {
  return 302 /widget/v1.js;
  add_header Cache-Control "public, max-age=300";
}
location ^~ /widget/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
}
